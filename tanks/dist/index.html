<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/assets/favicon-DzZ1BWTh.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0a0f0a" />
  <title>Battle Tanks</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <script type="module" crossorigin src="/assets/index-Bhcka4ei.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-JNp66VYC.css">
</head>

<body>
  <div id="loading-screen">
    <div class="loading-content">
      <div class="loading-badge">COMBAT SIM</div>
      <h1>Battle Tanks</h1>
      <p>Initializing battlefield systems…</p>
      <div id="loading-bar">
        <div id="loading-bar-fill"></div>
      </div>
      <span class="loading-hint">Loading terrain · syncing weapons · calibrating radar</span>
    </div>
  </div>

  <div id="app"></div>

  <div id="game-ui">
    <header class="hud-panel">
      <div class="hud-row">
        <span class="hud-label">Score</span>
        <span id="score-display">0</span>
      </div>
      <div class="hud-row armor-row">
        <span class="hud-label">Armor</span>
        <div id="health-bar-track">
          <div id="health-bar-fill"></div>
        </div>
        <span id="health-value">100%</span>
      </div>
    </header>

    <div id="instructions" class="hud-panel">
      <p class="instructions-title">Controls</p>
      <ul>
        <li><kbd>W</kbd> <kbd>S</kbd> or <kbd>↑</kbd> <kbd>↓</kbd> Move</li>
        <li><kbd>A</kbd> <kbd>D</kbd> or <kbd>←</kbd> <kbd>→</kbd> Rotate</li>
        <li><kbd>Space</kbd> Fire</li>
      </ul>
      <p class="instructions-tip">Destroy obstacles and enemy tanks to score.</p>
    </div>
  </div>

  <div id="damage-overlay" aria-hidden="true"></div>

  <div id="game-over" hidden>
    <div class="game-over-card">
      <p class="game-over-badge">MISSION FAILED</p>
      <h1 id="game-over-title">Tank Destroyed</h1>
      <p class="game-over-score">Final Score: <span id="final-score">0</span></p>
      <button id="restart-button" type="button">Deploy Again</button>
    </div>
  </div>

</body>

</html>
