# Render Blueprint for DecorAIt
# In Render dashboard: set Root Directory to "decorai" for this service
# so npm install runs here and installs @supabase/supabase-js etc.
#
# Variables marked sync: false must be set manually in the Render dashboard
# (Environment > Environment Variables) — they are secrets and not stored here.
services:
  - type: web
    name: decorait
    env: node
    # The unit tests run before the build: if one fails, the deploy stops and
    # the previous version keeps serving. They need no network or secrets.
    buildCommand: npm install && npm test && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production

      # Replicate (image generation)
      - key: REPLICATE_API_KEY
        sync: false

      # OpenAI (premium image edits + feng-shui analysis)
      - key: OPENAI_API_KEY
        sync: false

      # Anthropic (floor-plan image import via Claude vision)
      - key: ANTHROPIC_API_KEY
        sync: false

      # Supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

      # Stripe
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: STRIPE_SUBSCRIPTION_PRICE_ID
        sync: false
      # One-time token packs (set the price IDs in the Render dashboard)
      - key: STRIPE_PRICE_ID_PACK_10
        sync: false
      - key: STRIPE_PRICE_ID_PACK_20
        sync: false
      - key: STRIPE_PRICE_ID_PACK_50
        sync: false

      # App configuration
      - key: APP_URL
        sync: false
      # Other sites allowed to call the API (comma-separated). Unset = APP_URL's
      # origin only; never "*".
      - key: ALLOWED_ORIGIN
        sync: false
      # Content security policy: report (logs [csp-report], blocks only a small
      # baseline) | enforce | off. Move to enforce once the logs are quiet.
      - key: CSP_MODE
        value: report
      # Google Analytics 4 Measurement ID (e.g. G-XXXXXXXXXX). Leave unset to disable.
      - key: GA_MEASUREMENT_ID
        sync: false
      - key: FREE_TOKENS
        value: "0"
      - key: TOKENS_PER_PURCHASE
        value: "5"
      - key: PRICE_AMOUNT
        value: "199"
      # Subscriber monthly image-generation cap (matches SUBSCRIPTION_MONTHLY_LIMIT in server.js)
      - key: SUBSCRIPTION_MONTHLY_LIMIT
        value: "50"
      # Plan price shown on the upgrade sheet, in cents. Display only: keep it
      # equal to the STRIPE_SUBSCRIPTION_PRICE_ID price.
      - key: SUBSCRIPTION_PRICE_CENTS
        value: "1999"
      # "Shop this look" affiliate IDs (optional; links work without them).
      # SHOP_<RETAILER>_LINK_TEMPLATE is a network deep link with {url}.
      - key: SHOP_AMAZON_TAG
        sync: false
      - key: SHOP_WAYFAIR_LINK_TEMPLATE
        sync: false
      - key: SHOP_TARGET_LINK_TEMPLATE
        sync: false

      # ── Abuse prevention (all optional — sensible defaults live in server.js) ──
      # Comma-separated allowlist of Replicate model versions the proxy may run.
      # - key: REPLICATE_ALLOWED_MODELS
      #   sync: false
      # Comma-separated host allowlist for server-side image fetches (SSRF guard).
      # - key: IMAGE_FETCH_ALLOWED_HOSTS
      #   value: "replicate.delivery,replicate.com"
      # Rate limits. General = per-IP across all routes; Gen = per-IP/per-account
      # on the paid AI endpoints over RATE_LIMIT_GEN_WINDOW_MS.
      - key: RATE_LIMIT_GENERAL_MAX
        value: "300"
      - key: RATE_LIMIT_GEN_MAX_PER_IP
        value: "100"
      - key: RATE_LIMIT_GEN_MAX_PER_USER
        value: "40"
      - key: RATE_LIMIT_GEN_WINDOW_MS
        value: "600000"
      # Daily cap on free generations per account (0 disables). Run
      # sql/free_generation_daily_cap.sql in Supabase so the count is durable.
      - key: FREE_DAILY_GENERATION_LIMIT
        value: "30"
      - key: FREE_DAILY_GENERATION_LIMIT_SUBSCRIBER
        value: "100"
      # Pre-signup generation: a first-time visitor gets ANON_FREE_GENERATIONS
      # designs before creating an account. OFF unless ANON_DEVICE_SECRET is set
      # (openssl rand -hex 32) and sql/anonymous_generations.sql has been run.
      - key: ANON_DEVICE_SECRET
        sync: false
      # One-tap sign-in buttons (comma-separated: google,apple). Enable each
      # provider in Supabase Auth first, then list it here.
      - key: AUTH_OAUTH_PROVIDERS
        sync: false
      # Public share links: live links per account (0 = off). Run
      # sql/shared_designs.sql in Supabase to turn the feature on.
      - key: MAX_SHARED_LINKS_FREE
        value: "10"
      - key: MAX_SHARED_LINKS_SUBSCRIBER
        value: "50"
