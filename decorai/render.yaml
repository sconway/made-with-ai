# Render Blueprint for DecorAI
# In Render dashboard: set Root Directory to "decorai" for this service
# so npm install runs here and installs @supabase/supabase-js etc.
#
# Variables marked sync: false must be set manually in the Render dashboard
# (Environment > Environment Variables) — they are secrets and not stored here.
services:
  - type: web
    name: decorai
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production

      # Replicate (image generation)
      - key: REPLICATE_API_KEY
        sync: false

      # OpenAI (premium image edits + feng-shui analysis)
      - key: OPENAI_API_KEY
        sync: false

      # Anthropic (floor-plan image import via Claude vision)
      - key: ANTHROPIC_API_KEY
        sync: false

      # Supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

      # Stripe
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: STRIPE_SUBSCRIPTION_PRICE_ID
        sync: false
      # One-time token packs (set the price IDs in the Render dashboard)
      - key: STRIPE_PRICE_ID_PACK_10
        sync: false
      - key: STRIPE_PRICE_ID_PACK_20
        sync: false
      - key: STRIPE_PRICE_ID_PACK_50
        sync: false

      # App configuration
      - key: APP_URL
        sync: false
      - key: ALLOWED_ORIGIN
        sync: false
      - key: FREE_TOKENS
        value: "2"
      - key: TOKENS_PER_PURCHASE
        value: "5"
      - key: PRICE_AMOUNT
        value: "199"
      # Subscriber monthly image-generation cap (matches SUBSCRIPTION_MONTHLY_LIMIT in server.js)
      - key: SUBSCRIPTION_MONTHLY_LIMIT
        value: "50"

      # ── Abuse prevention (all optional — sensible defaults live in server.js) ──
      # Comma-separated allowlist of Replicate model versions the proxy may run.
      # - key: REPLICATE_ALLOWED_MODELS
      #   sync: false
      # Comma-separated host allowlist for server-side image fetches (SSRF guard).
      # - key: IMAGE_FETCH_ALLOWED_HOSTS
      #   value: "replicate.delivery,replicate.com"
      # Rate limits. General = per-IP across all routes; Gen = per-IP/per-account
      # on the paid AI endpoints over RATE_LIMIT_GEN_WINDOW_MS.
      - key: RATE_LIMIT_GENERAL_MAX
        value: "300"
      - key: RATE_LIMIT_GEN_MAX_PER_IP
        value: "100"
      - key: RATE_LIMIT_GEN_MAX_PER_USER
        value: "40"
      - key: RATE_LIMIT_GEN_WINDOW_MS
        value: "600000"
