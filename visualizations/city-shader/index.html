<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Infinite City — Shader</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: ui-monospace, Menlo, monospace; color: #cfe8ff; }
  canvas { display: block; width: 100vw; height: 100vh; }
  .hud {
    position: fixed; top: 12px; left: 14px; z-index: 2;
    font-size: 12px; line-height: 1.45; letter-spacing: 0.02em;
    text-shadow: 0 0 6px rgba(0,200,255,0.45);
    pointer-events: none; user-select: none;
    opacity: 0.85;
  }
  .hud b { color: #9ff; font-weight: 600; }
  .hint { opacity: 0.55; }
</style>
</head>
<body>
<div class="hud">
  <div><b>INFINITE CITY</b> · raymarched shader</div>
  <div class="hint">drag to look · scroll to zoom · space to toggle storm</div>
</div>
<canvas id="c"></canvas>
<script id="vs" type="x-shader/x-vertex">
  attribute vec2 a_pos;
  void main() { gl_Position = vec4(a_pos, 0.0, 1.0); }
</script>
<script id="fs" type="x-shader/x-fragment">
precision highp float;

uniform vec2  u_res;
uniform float u_time;
uniform vec2  u_look;   // yaw, pitch
uniform float u_zoom;   // dolly
uniform float u_storm;  // 0..1 storm intensity

// ---------- hash / noise ----------
float hash11(float p){ p = fract(p*0.1031); p *= p+33.33; p *= p+p; return fract(p); }
float hash12(vec2 p){
  vec3 p3 = fract(vec3(p.xyx)*0.1031);
  p3 += dot(p3, p3.yzx+33.33);
  return fract((p3.x+p3.y)*p3.z);
}
vec2 hash22(vec2 p){
  vec3 p3 = fract(vec3(p.xyx)*vec3(0.1031,0.103,0.0973));
  p3 += dot(p3, p3.yzx+33.33);
  return fract((p3.xx+p3.yz)*p3.zy);
}
float vnoise(vec2 p){
  vec2 i = floor(p), f = fract(p);
  vec2 u = f*f*(3.0-2.0*f);
  float a = hash12(i);
  float b = hash12(i+vec2(1,0));
  float c = hash12(i+vec2(0,1));
  float d = hash12(i+vec2(1,1));
  return mix(mix(a,b,u.x), mix(c,d,u.x), u.y);
}
float fbm(vec2 p){
  float v=0.0, a=0.5;
  for(int i=0;i<5;i++){ v += a*vnoise(p); p *= 2.02; a *= 0.5; }
  return v;
}

// ---------- SDFs ----------
float sdBox(vec3 p, vec3 b){
  vec3 q = abs(p) - b;
  return length(max(q,0.0)) + min(max(q.x,max(q.y,q.z)), 0.0);
}

// City: infinite grid of buildings, deterministic per-cell heights.
// Each cell has a building footprint smaller than the cell (street gaps).
const float CELL = 4.0;

float buildingHeight(vec2 cell){
  // Layered "districts": low rumble + high spike clusters
  float n = fbm(cell*0.07);
  float spikes = pow(hash12(cell*1.13+7.0), 3.0);
  float h = mix(2.0, 14.0, smoothstep(0.25, 0.85, n));
  h += 30.0 * spikes * smoothstep(0.55, 0.95, n);
  return h;
}

float mapCity(vec3 p, out vec2 outCell, out float outH){
  vec2 cell = floor(p.xz / CELL);
  vec2 cc   = (cell + 0.5) * CELL;
  vec2 local = p.xz - cc;

  // building footprint within cell (random offset + size)
  vec2 jitter = (hash22(cell) - 0.5) * (CELL*0.18);
  vec2 size   = vec2(0.7, 0.7) + hash22(cell+13.7) * 0.6; // 0.7..1.3
  float h     = buildingHeight(cell);

  vec3 q = vec3(local.x - jitter.x, p.y - h*0.5, local.y - jitter.y);
  float d = sdBox(q, vec3(size.x, h*0.5, size.y));

  outCell = cell;
  outH = h;
  return d;
}

// Ground plane
float mapGround(vec3 p){ return p.y; }

float map(vec3 p, out int id, out vec2 outCell, out float outH){
  float g = mapGround(p);
  vec2  cc; float hh;
  float c = mapCity(p, cc, hh);
  if(g < c){ id = 0; outCell = vec2(0.0); outH = 0.0; return g; }
  id = 1; outCell = cc; outH = hh; return c;
}

vec3 calcNormal(vec3 p){
  vec2 e = vec2(0.001, 0.0);
  int id; vec2 c; float h;
  float d = map(p, id, c, h);
  return normalize(vec3(
    map(p+e.xyy, id,c,h) - d,
    map(p+e.yxy, id,c,h) - d,
    map(p+e.yyx, id,c,h) - d
  ));
}

// ---------- Fractal: Mandelbrot-glow projected onto building facades ----------
float mandelGlow(vec2 uv, float t){
  vec2 c = (uv - 0.5) * vec2(3.0, 2.2) + vec2(-0.5, 0.0);
  c += 0.15 * vec2(sin(t*0.21), cos(t*0.17));
  vec2 z = vec2(0.0);
  float m = 0.0;
  for(int i=0;i<48;i++){
    z = vec2(z.x*z.x - z.y*z.y, 2.0*z.x*z.y) + c;
    if(dot(z,z) > 64.0){ m = float(i) - log2(log2(dot(z,z))) + 4.0; break; }
  }
  return m / 48.0;
}

// ---------- Lightning: fractal bolt via domain-warped noise ----------
float lightningBolt(vec2 uv, float seed, float t){
  // vertical-ish bolt with branching, distance to a noisy line
  float x = uv.x;
  float y = uv.y;
  float warp = 0.0;
  float amp = 0.35;
  float freq = 2.0;
  for(int i=0;i<5;i++){
    warp += amp * (vnoise(vec2(y*freq + seed*13.1, seed*7.3 + t*0.6)) - 0.5);
    amp *= 0.55; freq *= 2.1;
  }
  float d = abs(x - 0.0 - warp);
  float core = exp(-d*120.0);
  float glow = exp(-d*14.0) * 0.4;
  // branches: secondary bolts shifted
  float b = 0.0;
  for(int j=0;j<3;j++){
    float s = seed + float(j)*4.7;
    float bx = (hash11(s)-0.5)*1.2;
    float by = hash11(s+1.0);
    float warp2 = 0.0; float a2=0.25; float f2=3.0;
    for(int i=0;i<3;i++){
      warp2 += a2 * (vnoise(vec2(y*f2 + s*5.0, s*3.1)) - 0.5);
      a2 *= 0.6; f2 *= 2.0;
    }
    float dd = abs(x - bx - warp2);
    float mask = smoothstep(by, by-0.35, y); // fade out above origin
    b += (exp(-dd*100.0)*0.7 + exp(-dd*12.0)*0.2) * mask;
  }
  return core + glow + b;
}

// ---------- Scene render ----------
void main(){
  vec2 uv = (gl_FragCoord.xy - 0.5*u_res) / u_res.y;

  // Camera
  float yaw   = u_look.x;
  float pitch = clamp(u_look.y, -0.35, 0.6);
  float dolly = u_zoom;

  vec3 ro = vec3(sin(u_time*0.03)*2.0, 5.5 + dolly*0.5, u_time*2.4);
  // forward = yaw/pitch
  vec3 fwd = normalize(vec3(sin(yaw)*cos(pitch), -pitch, cos(yaw)*cos(pitch)));
  vec3 right = normalize(cross(fwd, vec3(0,1,0)));
  vec3 up    = cross(right, fwd);
  vec3 rd = normalize(fwd*1.2 + right*uv.x + up*uv.y);

  // raymarch
  float t = 0.0;
  int hitId = -1;
  vec2 hitCell = vec2(0.0); float hitH = 0.0;
  vec3 p;
  bool hit = false;
  for(int i=0;i<128;i++){
    p = ro + rd*t;
    int id; vec2 cc; float hh;
    float d = map(p, id, cc, hh);
    if(d < 0.002*t){ hit = true; hitId = id; hitCell = cc; hitH = hh; break; }
    t += d;
    if(t > 220.0) break;
  }

  // Sky
  float horiz = smoothstep(-0.05, 0.3, rd.y);
  vec3 skyTop = vec3(0.02, 0.04, 0.09);
  vec3 skyLow = vec3(0.06, 0.02, 0.12);
  vec3 sky = mix(skyLow, skyTop, horiz);
  // Distant city glow on horizon
  sky += vec3(0.9,0.4,0.15) * 0.12 * exp(-abs(rd.y)*9.0);
  // Storm clouds
  vec2 sp = rd.xz / max(rd.y, 0.05);
  float clouds = fbm(sp*0.5 + vec2(u_time*0.04, 0.0));
  sky = mix(sky, vec3(0.05,0.06,0.1), smoothstep(0.4, 0.85, clouds) * 0.6);

  // Lightning in sky
  vec3 col;
  if(hit){
    vec3 n = calcNormal(p);
    vec3 base;

    if(hitId == 0){
      // wet asphalt ground
      vec2 g = p.xz;
      float lane = smoothstep(0.02, 0.0, abs(fract(g.x/CELL+0.5)-0.5)-0.02);
      float lane2= smoothstep(0.02, 0.0, abs(fract(g.y/CELL+0.5)-0.5)-0.02);
      float road = max(lane, lane2);
      float wet = fbm(g*0.5);
      base = mix(vec3(0.015,0.02,0.03), vec3(0.05,0.07,0.1), wet);
      base += vec3(1.0,0.7,0.3) * road * 0.35;
    } else {
      // building facade — fractal-lit windows
      // pick a dominant axis to map UVs
      vec3 an = abs(n);
      vec2 fuv;
      if(an.y > 0.6){ fuv = p.xz; }
      else if(an.x > an.z){ fuv = vec2(p.z, p.y); }
      else { fuv = vec2(p.x, p.y); }

      // window grid
      vec2 gv = fuv * vec2(1.2, 0.9);
      vec2 cellv = floor(gv);
      vec2 lv = fract(gv) - 0.5;
      float win = smoothstep(0.38, 0.32, max(abs(lv.x), abs(lv.y)));
      // mandelbrot tint per cell
      float m = mandelGlow(hash22(cellv+hitCell)*0.6 + vec2(u_time*0.02, 0.0), u_time);
      // window on/off via hash + flicker
      float onMask = step(0.35, hash12(cellv+hitCell*3.7));
      float flick = 0.85 + 0.15*sin(u_time*6.0 + hash12(cellv)*30.0);

      vec3 winCol = mix(vec3(0.05,0.15,0.4), vec3(1.0,0.75,0.35), m);
      winCol = mix(winCol, vec3(0.4,1.0,0.9), pow(m, 4.0));

      base = vec3(0.02,0.025,0.035);
      base += win * onMask * flick * winCol * 1.6;

      // edge accent
      float edgeY = smoothstep(0.0, 0.2, fract(p.y*0.5));
      base += 0.02 * edgeY;
    }

    // Lighting
    vec3 L = normalize(vec3(0.4, 0.6, -0.3));
    float diff = max(dot(n, L), 0.0);
    col = base * (0.25 + 0.5*diff);

    // Lightning flash global illumination
    float flash = u_storm * (0.5 + 0.5*sin(u_time*1.7));
    flash = pow(max(flash,0.0), 6.0);
    col += base * flash * 1.4;

    // distance fog
    float fog = 1.0 - exp(-t*0.018);
    col = mix(col, sky, fog);
  } else {
    col = sky;

    // sky lightning bolts (multiple, time-keyed)
    float storm = u_storm;
    vec2 suv = vec2(uv.x, uv.y*0.8 + 0.2);
    float bolt = 0.0;
    for(int k=0;k<3;k++){
      float ks = float(k);
      float trig = step(0.985, hash11(floor(u_time*1.3 + ks*2.1)));
      float life = fract(u_time*1.3 + ks*2.1);
      float env = exp(-life*5.0) * trig;
      vec2 buv = suv;
      buv.x -= (hash11(floor(u_time*1.3+ks)+ks)-0.5)*1.2;
      bolt += lightningBolt(buv, ks*11.3 + floor(u_time*1.3+ks), u_time) * env * storm;
    }
    col += vec3(0.7, 0.85, 1.2) * bolt;
    col += vec3(0.4,0.6,1.0) * bolt * 0.3;
  }

  // bloom-ish lift on bright
  col += 0.03 * smoothstep(0.6, 1.0, max(col.r, max(col.g, col.b)));

  // vignette
  float vig = smoothstep(1.2, 0.4, length(uv));
  col *= vig;

  // tonemap + gamma
  col = col / (1.0 + col);
  col = pow(col, vec3(1.0/2.2));

  gl_FragColor = vec4(col, 1.0);
}
</script>
<script>
(() => {
  const canvas = document.getElementById('c');
  const gl = canvas.getContext('webgl', { antialias: false, premultipliedAlpha: false });
  if (!gl) { document.body.innerHTML = '<p style="color:#fff;padding:20px">WebGL not available.</p>'; return; }

  function compile(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
      console.error(gl.getShaderInfoLog(s));
      throw new Error('shader compile');
    }
    return s;
  }
  const vs = compile(gl.VERTEX_SHADER, document.getElementById('vs').textContent);
  const fs = compile(gl.FRAGMENT_SHADER, document.getElementById('fs').textContent);
  const prog = gl.createProgram();
  gl.attachShader(prog, vs); gl.attachShader(prog, fs);
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
    console.error(gl.getProgramInfoLog(prog));
    throw new Error('link');
  }
  gl.useProgram(prog);

  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, 'a_pos');
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

  const uRes   = gl.getUniformLocation(prog, 'u_res');
  const uTime  = gl.getUniformLocation(prog, 'u_time');
  const uLook  = gl.getUniformLocation(prog, 'u_look');
  const uZoom  = gl.getUniformLocation(prog, 'u_zoom');
  const uStorm = gl.getUniformLocation(prog, 'u_storm');

  let yaw = 0.0, pitch = 0.12, zoom = 0.0, storm = 1.0;
  let dragging = false, lx = 0, ly = 0;

  canvas.addEventListener('mousedown', e => { dragging = true; lx = e.clientX; ly = e.clientY; });
  window.addEventListener('mouseup', () => dragging = false);
  window.addEventListener('mousemove', e => {
    if (!dragging) return;
    yaw   += (e.clientX - lx) * 0.005;
    pitch += (e.clientY - ly) * 0.004;
    lx = e.clientX; ly = e.clientY;
  });
  canvas.addEventListener('wheel', e => {
    zoom += e.deltaY * 0.01;
    zoom = Math.max(-4, Math.min(20, zoom));
    e.preventDefault();
  }, { passive: false });
  window.addEventListener('keydown', e => {
    if (e.code === 'Space') { storm = storm > 0.5 ? 0.0 : 1.0; e.preventDefault(); }
  });

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    canvas.width  = Math.floor(window.innerWidth  * dpr);
    canvas.height = Math.floor(window.innerHeight * dpr);
    gl.viewport(0, 0, canvas.width, canvas.height);
  }
  window.addEventListener('resize', resize);
  resize();

  const t0 = performance.now();
  function frame() {
    const t = (performance.now() - t0) / 1000;
    gl.uniform2f(uRes, canvas.width, canvas.height);
    gl.uniform1f(uTime, t);
    gl.uniform2f(uLook, yaw, pitch);
    gl.uniform1f(uZoom, zoom);
    gl.uniform1f(uStorm, storm);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    requestAnimationFrame(frame);
  }
  frame();
})();
</script>
</body>
</html>
